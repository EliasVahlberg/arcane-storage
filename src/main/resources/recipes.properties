# Arcane Storage -- what everything costs.
#
# This file is the only place these numbers exist. Java reads it at load, the Python scenario tests read it
# directly, and the docs point at it rather than restating it. That is deliberate and it is not tidiness: the unit
# materials were written in an enum and copied into a roadmap table, the two disagreed for two commits without
# anything failing, and a commit claiming to have fixed it had not checked either. A number that lives in one place
# cannot drift from itself.
#
# It ships inside the jar rather than in the config directory, so both sides of a connection always read the same
# values. A player-editable version would be a different feature with a real hazard: the server validates an
# upgrade while the client draws the button, so a client whose file disagreed would show costs the server refuses.
#
# FORMAT
#   <key>.materials = <item id> <amount>, <item id> <amount>, ...
#   <key>.count     = how many the recipe yields, when it is not 1
#
# Item IDs are the game's own registry string IDs, greppable in reference/grep/locale.tsv. They are not checked
# when this file is read -- the item registry is not populated yet at that point -- so a typo here fails when the
# recipe registers at load, not at compile. If the mod stops loading after a change to this file, read the server
# log for the recipe that names an ingredient the game has never heard of.
#
# A missing or malformed entry is a hard error rather than an empty ingredient list, because an empty ingredient
# list is a free recipe and a free recipe is silent.

# --- The way in -------------------------------------------------------------------------------------------------
#
# Crafted at a Workstation, beside the storagebox it stands in for. Costs more than a storagebox because it reaches
# every unit in a network rather than holding items itself, and it is still the cheapest thing in the mod: gating
# the entry point harder only delays the player finding out whether they want the mod at all.

recipe.terminal.materials = anylog 80, ironbar 20

# --- Wiring and edges -------------------------------------------------------------------------------------------
#
# Hand-craftable on purpose. These are the parts a player places dozens of, and a network is unusable without
# enough of them, so a cost worth thinking about would only be a tax on laying cable.

recipe.conduit.materials = ironbar 1
recipe.conduit.count = 4

recipe.importbus.materials = anylog 20, ironbar 10
recipe.exportbus.materials = anylog 20, ironbar 10

# --- The unit ladder --------------------------------------------------------------------------------------------
#
# Storage Units and Station Units share these numbers. One table means the two ladders cannot drift apart; if the
# two should ever cost different amounts, split the keys rather than the code that reads them.
#
# Each rung above the base is listed as materials only. Two things consume it:
#
#   crafting a unit    -- one unit of the rung below, plus these materials, at that era's workstation
#   upgrading in place -- these materials only, since the unit standing on the tile IS the rung below
#
# So the numbers are deliberately modest. A player owns many units rather than one, and a per-unit price that
# reads as a grind stops the upgrade being something to look forward to -- which is the point of a ladder. The
# tier below staying at one unit is part of the same decision: scaling it compounds, and at x5 a single Fallen unit
# would swallow 125 base ones, which is not a cost curve but an accident of multiplication.
#
# Only the base rung uses anylog, and that matters beyond cost. anylog is a GlobalIngredientRegistry entry rather
# than an item, so no inventory can be asked how many it holds -- an in-place upgrade could not count it. The base
# is never an upgrade target, since there is nothing below it, so the question never arises. Giving any higher rung
# a global ingredient would break the affordability check, not just rebalance it.

tier.base.materials = anylog 40, ironbar 10
tier.demonic.materials = demonicbar 10
tier.tungsten.materials = tungstenbar 10, quartz 5
tier.fallen.materials = upgradeshard 10, alchemyshard 10

# --- Wireless access --------------------------------------------------------------------------------------------
#
# Two ladders of three, starting an era above the units: the carried Wireless Terminal and the placed Wireless
# Transceiver. Both ends must be upgraded for a rung to take effect, since the lower of the two decides the reach.
#
# Each rung costs the era's bar or shard plus that era's gemstone, and the gemstone is what makes these different
# from the unit ladder. Gems have almost no other sink in Necesse -- sapphire, ruby and pearlescent diamond are
# mined in quantity and spent on very little -- so a feature players actively want is a good place to ask for them.
# It also means the cost is felt as "go mine" rather than "grind bars", which is a different afternoon.
#
# The transceiver costs half again as much as the terminal at every rung, on purpose: one is a tool a player may
# want several of, the other is infrastructure they need exactly one of per network.
#
# The upper two rungs also consume the rung below, as the unit ladder does. Note what that means for the two
# consumers of these numbers: crafting takes the previous rung plus the materials, while an in-place upgrade of a
# placed transceiver takes the materials only, because the transceiver on the tile IS the previous rung.
#
# The Demonic terminal deliberately keeps the unsuffixed key, matching the string ID it was first registered under.

recipe.wirelessterminal.demonic.materials = demonicbar 10, sapphire 5
recipe.wirelessterminal.tungsten.materials = tungstenbar 10, ruby 5
recipe.wirelessterminal.fallen.materials = upgradeshard 10, pearlescentdiamond 5

recipe.wirelesstransceiver.demonic.materials = demonicbar 15, sapphire 10
recipe.wirelesstransceiver.tungsten.materials = tungstenbar 15, ruby 10
recipe.wirelesstransceiver.fallen.materials = upgradeshard 15, pearlescentdiamond 10

# --- The frequency band -----------------------------------------------------------------------------------------
#
# An Arcane Base Station carries the same price as a Wireless Transceiver at every rung, because it is the same kind
# of thing: one per network, placed once, and what the player is buying is reach rather than capacity. The two are
# also built together -- a station will not transmit without a transceiver on its network -- so pricing them apart
# would only make one of them read as the tax on the other.
#
# An Access Point costs a base Storage Unit plus a single sapphire. The unit half is the honest part of the price: an
# Access Point is what turns a heap of units into a silo, so it should cost about what one more unit costs. The
# sapphire is what stops it being free -- one gem per silo is a real errand the first time and nothing by the tenth,
# which is the right shape for a part a player places once per outbuilding.
#
# Each station rung consumes the rung below, as every ladder in this file does.

recipe.basestation.demonic.materials = demonicbar 15, sapphire 10
recipe.basestation.tungsten.materials = tungstenbar 15, ruby 10
recipe.basestation.fallen.materials = upgradeshard 15, pearlescentdiamond 10

recipe.accesspoint.materials = anylog 40, ironbar 10, sapphire 1
