plugins {
    id 'java'
}

// Mod identity. Project name lives in settings.gradle.
// To change the project name, edit the settings.gradle file

project.ext.modID = "elias.arcanestorage" // The unique id of your mod. Must be all lowercase and cannot use special characters.
project.ext.modName = "Arcane Storage" // The display name of your mod.
project.ext.modVersion = "1.0.6" // Your current builds version. Must follow the xx.xx... format.
project.ext.gameVersion = "1.3.2" // The target game version.
project.ext.modDescription = "Unified, searchable storage and crafting. View every connected container as one inventory and craft from all of it." // Short description of what your mod is.
project.ext.author = "Elias Vahlberg" // Your name

/**
 * When setting clientside to true, it means servers do not need this mod for clients to connect and vice versa.
 * IMPORTANT: If you set this to true, make sure that your mod does not add any content or do anything
 * that could cause clients and servers to desync. This includes registering any items, objects, tiles, packets etc.
 */
project.ext.clientside = false

/**
 * The other mod dependencies of this mod
 * Dependencies define the default load order of mods
 * Uncomment and configure these if your mod has dependencies
 */
//project.ext.modDependencies = ["other.modid1", "other.modid2"]
// No dependency on the harness is declared, in either direction, and that is deliberate rather than an omission.
//
// An unmet optional dependency is not silently ignored: FormModListElement counts unmet ones into dependWarning, which
// draws the mod's name in warningTextColor in the Mods menu, so declaring a mod nobody can obtain would flag this one
// as suspect on every player's mod list. It is not needed either, because the harness discovers this mod's bridge from
// its own postInit -- by which point the engine has run every mod's init -- so no load-order relationship exists to
// express. See buildModJar for how the bridge ships.


// The path to the games install directory, modify this only if the auto-detection fails
// Allow overriding via gradle.properties (necesseGameDir), since the upstream
// Linux default assumes ~/.local/share/Steam and misses the Debian/Ubuntu
// steam-package layout (~/.steam/debian-installation).
def gameDirectory = (project.findProperty('necesseGameDir') ?: getDefaultGamePath()).toString()

// =================================================
// ========== DO NOT EDIT BELOW THIS LINE ==========
// =================================================

// Name of the jar
def jarName = "${project.ext.modName.replace(" ", "")}-${project.ext.gameVersion}-${project.ext.modVersion}"

group project.ext.modID
version project.ext.modVersion

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

configurations {
    libDepends
}

sourceSets.main.output.resourcesDir = file("build/mod/resources/")
sourceSets.main.java.getDestinationDirectory().set(file("build/mod/"))
sourceSets.main.compileClasspath += configurations.libDepends // Adds libDepends configuration to classpath
def buildLocation = "build/jar/"

compileJava.options.encoding = "UTF-8"

println "Checking for the Necesse.jar inside: ${gameDirectory}"
if (!file(gameDirectory + "/Necesse.jar").exists()) {
    throw new Exception("Could not find game install directory. Make sure it is correct in build.gradle file.")
} else {
    println "Success"
}

dependencies {
    implementation files(gameDirectory + "/Necesse.jar")
    implementation fileTree(gameDirectory + "/lib/")
    implementation fileTree("./mods/") // Add all mods located in local mods folder

    // Add any third party library dependencies here. Remember to use libDepends, so that they will be added to your jar on build
    // These are some examples:
//    libDepends group: 'com.google.guava', name: 'guava', version: '31.1-jre'
//    libDepends files("path/to/library/jar.jar")
}

tasks.register('createAppID') {
    group "necesse"
    description "Creates steam_appid.txt file"

    doLast {
        file("steam_appid.txt").text = "1169040"
    }
}

tasks.register('createModInfoFile', JavaExec) {
    group "necesse"
    description "Creates the mod info file"

    classpath = files(gameDirectory + "/Necesse.jar")

    getMainClass().set("CreateModInfoFile")

    args "-file", "${sourceSets.main.java.getClassesDirectory().get()}/mod.info",
            "-id", "${project.ext.modID}",
            "-name", "${project.ext.modName}",
            "-version", "${project.ext.modVersion}",
            "-gameVersion", "${project.ext.gameVersion}",
            "-description", "${project.ext.modDescription}",
            "-author", "${project.ext.author}",
            "-clientside", "${project.ext.clientside}",
            "-dependencies", project.ext.has("modDependencies") ? "[" + project.ext.modDependencies.join(", ") + "]" : "",
            "-optionalDependencies", project.ext.has("modOptionalDependencies") ? "[" + project.ext.modOptionalDependencies.join(", ") + "]" : ""
}
// Makes compiling also create mod info file
classes.dependsOn("createModInfoFile")

// Names the bridge's entry class for necesseheadlessharness.ModBridges, which reads this file from the jar and calls
// the class's static register(). One name per line; '#' comments are ignored.
//
// A marker file rather than a naming convention, so the harness never has to guess a class name and a mod can move or
// rename its bridge without the harness caring.
tasks.register('createBridgeMarker') {
    group "necesse"
    description "Writes the harness bridge marker naming the bridge's entry class"

    doLast {
        file("${buildDir}/harnessbridge").mkdirs()
        file("${buildDir}/harnessbridge/bridge.txt").text = "arcanestorage.harness.ArcaneStorageVerbs\n"
    }
}

tasks.register('preAntialiasTextures', JavaExec) {
    group "necesse"
    description "Runs pre-antialiasing on all textures in the resources folder"

    classpath = files(gameDirectory + "/Necesse.jar")

    main "PreAntialiasTextures"
    args "-folders", "${sourceSets.main.resources.srcDirs.stream().map { file -> file.path }.toArray().join(";")}"
}

tasks.register('runClient', JavaExec) {
    group "necesse"
    description "Run client with current mod"
    dependsOn "buildModJar", "createAppID"

    classpath = files(gameDirectory + "/Necesse.jar")

    getMainClass().set("StartSteamClient")
    jvmArgs "-Xms512m", "-Xmx4G", "-XX:+UnlockExperimentalVMOptions", "-XX:+UseG1GC", "-XX:G1NewSizePercent=20", "-XX:G1ReservePercent=20", "-XX:MaxGCPauseMillis=50", "-XX:G1HeapRegionSize=32M"
    args "-dev", "-mod \"${buildLocation}\""
}

tasks.register('runDevClient', JavaExec) {
    group "necesse"
    description "Run client with current mod"
    dependsOn "buildModJar", "createAppID"

    classpath = files(gameDirectory + "/Necesse.jar")

    getMainClass().set("StartSteamClient")
    jvmArgs "-Xms512m", "-Xmx4G", "-XX:+UnlockExperimentalVMOptions", "-XX:+UseG1GC", "-XX:G1NewSizePercent=20", "-XX:G1ReservePercent=20", "-XX:MaxGCPauseMillis=50", "-XX:G1HeapRegionSize=32M"
    args "-dev 1", "-mod \"${buildLocation}\""
}

tasks.register('runServer', JavaExec) {
    group "necesse"
    description "Run server with current mod"
    dependsOn "buildModJar"

    classpath = files(gameDirectory + "/Server.jar")

    getMainClass().set("StartDesktopServer")
    jvmArgs "-Xms512m", "-Xmx4G", "-XX:+UnlockExperimentalVMOptions", "-XX:+UseG1GC", "-XX:G1NewSizePercent=20", "-XX:G1ReservePercent=20", "-XX:MaxGCPauseMillis=50", "-XX:G1HeapRegionSize=32M"
    args "-mod \"${buildLocation}\""
}

tasks.register('buildModJar', Jar) {
    group "necesse"
    description "Generates the mod jar into the build folder"
    dependsOn "classes", "createModInfoFile", "createBridgeMarker"

    doFirst {
        fileTree(dir: buildLocation).exclude("${jarName}.jar").visit { FileVisitDetails details ->
            delete details.file
        }
    }

    // Add mod output, minus the harness bridge, which ships below as resources instead
    from(sourceSets.main.java.getClassesDirectory()) {
        exclude "arcanestorage/harness/**"
    }

    // The harness bridge, shipped in the one jar everybody runs -- players included -- but renamed so the mod loader
    // never treats it as code.
    //
    // Every class in arcanestorage/harness implements the harness's TestVerb or TestQuery. LoadedMod.loadClasses calls
    // loadClass on each .class entry as the mod loads, and defining a class resolves its interfaces, so with the
    // harness absent those definitions fail and the loader turns the LinkageError into a fatal ModLoadException. Note
    // how narrow that is: only supertypes are eager. This mod's own entry class holds an invokestatic to a harness
    // class and loads fine, because a method body resolves lazily.
    //
    // The loader's test for what is code is the .class suffix and nothing more, so a rename is enough to make these
    // opaque. necesseheadlessharness.ModBridges reads them back and defines them, but only when the harness is
    // actually running -- so a player's game never defines them at all, and the jar the scenario suite tests is the
    // jar that ships. Do not "fix" this by excluding them again: that would return the suite to testing an artifact
    // nobody runs.
    from(sourceSets.main.java.getClassesDirectory()) {
        include "arcanestorage/harness/**"
        into "harnessbridge"
        rename { String name -> name + "data" }
    }
    from("${buildDir}/harnessbridge") {
        into "harnessbridge"
    }

    // Add the dependencies
    from configurations.libDepends.collect { it.isDirectory() ? it : zipTree(it) }

    setArchiveFileName("${jarName}.jar")
    setDestinationDirectory(file(buildLocation))
}

enum OS { WINDOWS, MAC, LINUX, UNKNOWN }

// Returns the Enum value of OS based on the match
// Linux has more options as Ubuntu-like, NixOS and OpenBSD may not contain "linux"
def getOS() {
    def os = System.getProperty("os.name").toLowerCase()
    println "Detected OS: ${os}"

    if (os.contains("win")) return OS.WINDOWS
    else if (os.contains("mac") || os.contains("darwin")) return OS.MAC
    else if (os.contains("untu") || os.contains("nux") || os.contains("nix") || os.contains("bsd")) return OS.LINUX
    else return OS.UNKNOWN
}

// On the UNKNOWN we try linux-like path as it's the most likely to have a specific name
def getDefaultGamePath() {
    def homeDir = System.getProperty('user.home')

    return switch (getOS()) {
        case OS.WINDOWS -> "C:/Program Files (x86)/Steam/steamapps/common/Necesse"
        case OS.MAC -> homeDir + "/Library/Application Support/Steam/steamapps/common/Necesse"
        case OS.LINUX, OS.UNKNOWN -> homeDir + "/.local/share/Steam/steamapps/common/Necesse"
    }
}

// =================================================
// ========== Arcane Storage additions =============
// =================================================
// Appended at the very end on purpose. Everything above is upstream ExampleMod, so
// keeping additions at the tail is the most merge-friendly place for them.
//
// Tests cover only game-independent logic — network traversal, and later the aggregation
// rules — since anything touching Level or ObjectEntity needs a running game and belongs
// in manual QA instead.

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()

    // JarLoadsWithoutHarnessTest reads the built jar and the game's classes, so both must exist and be findable. The
    // jar dependency also means a plain 'gradlew test' cannot silently skip past the release invariant with a stale or
    // absent jar.
    dependsOn "buildModJar"
    systemProperty 'necesseGameDir', gameDirectory

    testLogging {
        events "passed", "failed"
        exceptionFormat "full"
    }
}

// Enables the debug panel (F10) so items and objects can be spawned while testing:
// WorldSettings line 441 is `allowCheats || cheatsHidden`, so this grants cheats
// without setting the world's own allowCheats flag — no permanent mark on the save.
tasks.named('runClient') {
    args '-hiddencheats'
    // Lets 'harness run <name>' find scene files from in-game chat, with -Pharness. The property is
    // the harness's, not ours: this mod's verbs are contributed to the harness's own command and it
    // never had one of its own, so the old 'arcanestorage.scenarios' name was read by nothing.
    systemProperty 'necesseheadlessharness.scenarios', "${projectDir}/tests/scenes"
    // -Ppacketlog turns on the inbound packet log (see arcanestorage.dev.PacketLogPatch).
    // Singleplayer is a real server in the same process, so this captures there too.
    if (project.hasProperty('packetlog')) {
        systemProperty 'arcanestorage.packetlog', '1'
    }
    // -Pharness wakes the headless harness inside this client, so '/harness fill 1 0 stone 2000'
    // works in your own world for setting up a scene to look at. Off by default: the harness is
    // dormant in a client since it coincided with a keyboard hang while hosting (Aug 2026).
    if (project.hasProperty('harness')) {
        args '-harness'
    }
}

// The dedicated server builds a Swing window (ServerJFrame, in Server.jar) before any mod
// loads, so it cannot start on this machine's headless-only JDK 17 — every JFrame throws
// regardless of DISPLAY. The game ships its own headful JRE, so run the server on that.
// The build still uses the system JDK 17, since only the launched JVM needs AWT.
//
// -nogui is a real, built-in option: DesktopServerWindow.init skips the JFrame and starts
// a ServerScanThread that reads stdin lines into ServerLoader.handleCommand. So the server
// is scriptable with no custom launcher — which is why standardInput is wired through.
// -log_debug_prints is undocumented in the server's own -help output and sends debug
// prints to the log file as well as the console.
//
// -PnecesseServerWorld=<name> picks the world. Defaults to a harness-only world so an
// automated run never mutates a world used for manual testing.
tasks.named('runServer') {
    executable = "${gameDirectory}/jre/bin/java"
    args '-nogui', '-log_debug_prints'
    args '-world', (project.findProperty('necesseServerWorld') ?: 'arcane_harness')
    standardInput = System.in
}
